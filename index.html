<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2952CC">
<title>สารบรรณออนไลน์ · ประสาทวิทยา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232952CC'/%3E%3Cstop offset='1' stop-color='%236C4BD5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 18h17l7 7v21H20z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M26 33h12M26 40h8' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<script>
/* ===================== ตั้งค่า (แก้บรรทัดเดียว) =====================
   วาง URL เว็บแอปจาก Apps Script ระหว่าง '' (ลงท้าย /exec ห้ามใส่ ?k=)
   เช่น const APP_URL = 'https://script.google.com/macros/s/AKfy…/exec';
   ถ้าเว้นว่าง ผู้ใช้ต้องวาง "ลิงก์เต็ม" ที่ได้จากผู้ดูแลในครั้งแรก
   ================================================================== */
const APP_URL = 'https://script.google.com/macros/s/AKfycbxvgC2Xm5MSYBy2LfN7scocibyiYNWriHbQvkJpxqP3gN-xH7OPLHRE4wgG12aIUkob0A/exec';
</script>
<style>
:root{--bg:#F4F6FA;--surface:#fff;--line:#E2E6EE;--ink:#141B2D;--ink-2:#4A5468;--ink-3:#8590A5;--accent:#2952CC;--soft:#E8EEFC;--crit:#C9264B;
  --f:"Noto Sans Thai","Sarabun","Leelawadee UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0D1220;--surface:#151C2C;--line:#283248;--ink:#E6EAF2;--ink-2:#A9B3C6;--ink-3:#77829A;--accent:#7EA2FF;--soft:#1D2A4D;--crit:#FF8DA6}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
/* ---------- หน้าเข้าใช้งาน ---------- */
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 40px rgba(20,27,45,.08);overflow:hidden}
.top{background:linear-gradient(120deg,#2952CC,#6C4BD5);color:#fff;padding:28px 26px 24px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.mk{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.top h1{margin:0;font-size:22px;line-height:1.3}.top p{margin:4px 0 0;opacity:.85;font-size:14px}
.body{padding:22px 26px 26px;display:flex;flex-direction:column;gap:14px}
label.l{font-size:13.5px;color:var(--ink-2);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;width:100%}
@media (prefers-color-scheme:dark){.btn{color:#0B1530}}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);cursor:pointer}
.err{color:var(--crit);font-size:13.5px;min-height:1em}
.hint{font-size:13px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
/* ---------- หน้าแอป ---------- */
.app{position:fixed;inset:0;background:var(--bg)}
.app iframe{width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px;pointer-events:none}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.15);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
@media (min-width:901px){.fab{bottom:18px}}
.menu{position:fixed;right:14px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:230px}
@media (min-width:901px){.menu{bottom:66px}}
.menu button,.menu a{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--ink);text-decoration:none;cursor:pointer;text-align:left}
.menu button:hover,.menu a:hover{background:var(--soft)}
.menu .danger{color:var(--crit)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</head>
<body>
<!-- หน้าเข้าใช้งาน (แสดงครั้งแรกในแต่ละเครื่อง) -->
<main class="gate" id="gate" hidden>
  <div class="card">
    <div class="top"><div class="mk">สบ</div><h1>สารบรรณออนไลน์</h1><p>สาขาวิชาประสาทวิทยา · ค้นหาหนังสือ งาน และแจ้งเตือน</p></div>
    <form class="body" id="form" autocomplete="off">
      <div><label class="l" for="code">วางลิงก์ที่ได้รับจากผู้ดูแล หรือรหัสเข้าใช้</label>
        <input class="inp" id="code" placeholder="https://script.google.com/…/exec?k=… หรือ รหัส 12 ตัว" spellcheck="false" autocapitalize="off" autofocus></div>
      <label class="chk"><input type="checkbox" id="remember" checked> จำไว้ในเครื่องนี้ ครั้งหน้าเปิดได้ทันที</label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">เข้าใช้งาน</button>
      <div class="hint">ระบบจะเปิดหน้าตามสิทธิ์ของลิงก์: ผู้ดูแลจัดการได้ทั้งหมด · ผู้ดูค้นหาและอ่านได้อย่างเดียว<br>ไม่มีลิงก์? ติดต่อผู้ดูแลระบบของสาขาวิชา</div>
    </form>
  </div>
</main>

<!-- หน้าแอป -->
<div class="app" id="app" hidden>
  <div class="loading" id="loading"><div><div class="spin"></div>กำลังเปิดสารบรรณออนไลน์…</div></div>
  <iframe id="frame" title="สารบรรณออนไลน์" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  <button class="fab" id="fab" aria-label="เมนู" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  <div class="menu" id="menu" hidden>
    <a id="newTab" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>เปิดในแท็บใหม่ (เต็มจอ)</a>
    <button id="reload"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>โหลดใหม่</button>
    <button id="logout" class="danger"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>ออกจากระบบในเครื่องนี้</button>
  </div>
</div>

<script>
const KEY = 'saraban.link';
const $ = s => document.getElementById(s);
const store = {
  get() { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
  set(v, remember) { try { (remember ? localStorage : sessionStorage).setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} }
};
/** รับได้ทั้ง ลิงก์เต็ม (…/exec?k=xxx) หรือ รหัสอย่างเดียว (ต้องตั้ง APP_URL) */
function toLink(input) {
  const t = String(input || '').trim();
  if (!t) return '';
  const m = t.match(/^(https:\/\/script\.google(?:usercontent)?\.com\/[^\s?#]+\/exec)\?(?:[^#\s]*&)?k=([A-Za-z0-9]+)/);
  if (m) return m[1] + '?k=' + m[2];
  if (/^[A-Za-z0-9]{6,40}$/.test(t) && APP_URL) return APP_URL.replace(/\?.*$/, '') + '?k=' + t;
  return '';
}
function openApp(link) {
  $('gate').hidden = true; $('app').hidden = false;
  $('newTab').href = link;
  $('frame').onload = () => { $('loading').hidden = true; };
  $('frame').src = link;
}
function showGate(msg) {
  $('app').hidden = true; $('gate').hidden = false; $('err').textContent = msg || '';
  $('code').focus();
}
$('form').onsubmit = e => {
  e.preventDefault();
  const link = toLink($('code').value);
  if (!link) {
    $('err').textContent = APP_URL ? 'ลิงก์หรือรหัสไม่ถูกต้อง — คัดลอกจากผู้ดูแลอีกครั้ง' : 'กรุณาวางลิงก์เต็มที่ขึ้นต้นด้วย https://script.google.com/ และมี ?k=';
    return;
  }
  store.set(link, $('remember').checked);
  openApp(link);
};
$('fab').onclick = () => { const m = $('menu'); m.hidden = !m.hidden; $('fab').setAttribute('aria-expanded', !m.hidden); };
$('reload').onclick = () => { $('menu').hidden = true; $('loading').hidden = false; $('frame').src = $('frame').src; };
$('logout').onclick = () => { if (!confirm('ออกจากระบบในเครื่องนี้? ครั้งหน้าต้องวางลิงก์ใหม่')) return; store.clear(); $('frame').src = 'about:blank'; $('menu').hidden = true; $('code').value = ''; showGate(); };
document.addEventListener('click', e => { if (!e.target.closest('#menu,#fab')) $('menu').hidden = true; });

/* เปิดจากลิงก์แชร์แบบ  https://…github.io/…/#k=รหัส  (รหัสอยู่หลัง # จึงไม่ถูกส่งไปเซิร์ฟเวอร์ใด) */
(function start() {
  const h = location.hash.replace(/^#/, '');
  if (h) {
    const k = (h.match(/(?:^|&)k=([A-Za-z0-9]+)/) || [])[1];
    const link = toLink(k ? k : decodeURIComponent(h));
    history.replaceState(null, '', location.pathname + location.search);
    if (link) { store.set(link, true); openApp(link); return; }
  }
  const saved = store.get();
  if (saved) openApp(saved); else showGate();
})();
</script>
</body>
</html>
