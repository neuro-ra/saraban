<!DOCTYPE html>
<html lang="th">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2952CC">
<title>สารบรรณออนไลน์ · ประสาทวิทยา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232952CC'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E0%B8%AA%E0%B8%9A%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#F0F2F7;--line:#E2E6EE;--ink:#141B2D;--ink-2:#4A5468;--ink-3:#8590A5;
  --accent:#2952CC;--accent-ink:#FFFFFF;--accent-soft:#E8EEFC;
  --in:#0E8A5F;--in-soft:#E3F5EE;--out:#5B4BD5;--out-soft:#EDEBFC;
  --amber:#B86E00;--amber-soft:#FDF1DC;--violet:#7A3FC9;--violet-soft:#F1E9FC;--blue:#1F6FD1;--blue-soft:#E5F0FC;
  --rose:#C9264B;--rose-soft:#FCE7EC;--slate:#5B6577;--slate-soft:#EEF0F4;--ok:#0E8A5F;--warn:#B86E00;--crit:#C9264B;
  --radius:14px;--shadow:0 1px 2px rgba(20,27,45,.05),0 4px 16px rgba(20,27,45,.05);
  --f:"Noto Sans Thai","Sarabun","Leelawadee UI",Tahoma,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Noto Sans Thai","Sarabun",Tahoma,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0D1220;--surface:#151C2C;--surface-2:#1C2436;--line:#283248;--ink:#E6EAF2;--ink-2:#A9B3C6;--ink-3:#77829A;
  --accent:#7EA2FF;--accent-ink:#0B1530;--accent-soft:#1D2A4D;--in:#4FCB9B;--in-soft:#14302A;--out:#A79BFF;--out-soft:#26214A;
  --amber:#F0B34E;--amber-soft:#3A2C12;--violet:#C49BFF;--violet-soft:#2E2147;--blue:#7DB4FF;--blue-soft:#172B47;
  --rose:#FF8DA6;--rose-soft:#3F1B27;--slate:#AAB4C6;--slate-soft:#232B3B;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(to right,var(--surface) 247px,var(--line) 247px,var(--line) 248px,transparent 248px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#6C4BD5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.logo b{display:block;font-size:15.5px;line-height:1.2}.logo small{color:var(--ink-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--ink-2);text-align:left;font-size:15px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;padding:10px 8px;font-size:12.5px;color:var(--ink-3)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.role.admin{background:var(--accent-soft);color:var(--accent)}
.main{min-width:0;padding:28px 32px 90px;max-width:1180px;width:100%}
.topbar{display:none}
.bnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:none}.side{display:none}
  .main{padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line)}
  .topbar .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6C4BD5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
  .topbar b{font-size:15px}.topbar .role{margin-left:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:6px 2px;border-radius:10px;font-weight:500}
  .bnav button[aria-current="page"]{color:var(--accent);font-weight:600}
  .bnav button[aria-current="page"] svg{background:var(--accent-soft);border-radius:99px;padding:3px 14px;width:50px;height:28px}
}

/* ---------- common ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.ph h1{font-size:24px;margin:0;line-height:1.25;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--ink-3);font-size:14px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg.i{width:17px;height:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel>h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h2 a,.panel>h2 button.link{margin-left:auto;font-size:13px;font-weight:500;border:0;background:none;color:var(--accent);padding:0}
.pb{padding:14px 16px}
.empty{text-align:center;color:var(--ink-3);padding:36px 12px;font-size:14px}
.empty svg{width:34px;height:34px;opacity:.5;display:block;margin:0 auto 8px}
.note{font-size:13px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--slate-soft);color:var(--slate);white-space:nowrap}
.chip.in{background:var(--in-soft);color:var(--in)}.chip.out{background:var(--out-soft);color:var(--out)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}.chip.crit{background:var(--rose-soft);color:var(--rose)}
.chip.ok{background:var(--in-soft);color:var(--ok)}
.t-คุมสอบ{--c:var(--amber);--cs:var(--amber-soft)}.t-สอน{--c:var(--violet);--cs:var(--violet-soft)}
.t-ประชุม{--c:var(--blue);--cs:var(--blue-soft)}.t-ประกาศ{--c:var(--rose);--cs:var(--rose-soft)}
.t-อื่นๆ,.t-{--c:var(--slate);--cs:var(--slate-soft)}
.chip.type{background:var(--cs);color:var(--c)}
mark{background:color-mix(in srgb,#FFC83D 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 40%,var(--surface)),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:900px){.toast{bottom:96px}}

/* ---------- home ---------- */
.hero{border-radius:20px;padding:24px;background:linear-gradient(120deg,var(--accent),#6C4BD5);color:#fff;position:relative;overflow:hidden;margin-bottom:18px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.85;font-size:13.5px}.hero h1{margin:2px 0 14px;font-size:24px;line-height:1.3}
.hsearch{display:flex;align-items:center;gap:10px;background:#fff;color:#141B2D;border-radius:12px;padding:0 6px 0 14px;max-width:620px;position:relative;z-index:1}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:13px 0;font-size:16px;color:#141B2D}
.hsearch .btn{background:var(--accent);color:#fff;border:0}
@media (prefers-color-scheme:dark){.hsearch .btn{color:#fff;background:#2952CC}}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.qa button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:6px 14px;font-weight:500;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.qa button:hover{background:rgba(255,255,255,.22)}.qa svg.i{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}.stat small{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media (max-width:1050px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.hero{padding:18px}.hero h1{font-size:20px}}
.alert{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:14px;margin-bottom:16px}
.alert b{color:var(--ink)}.alert .btn{margin-left:auto}

/* ---------- letters ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:2px 0 12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.toolbar{top:53px}}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.search input::-webkit-search-cancel-button{display:none}
.search svg{color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;font-size:13.5px;border-radius:99px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer}
.tgl:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tgl input{display:none}
.status{font-size:13px;color:var(--ink-3);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.card .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.card .ic.in{background:var(--in-soft);color:var(--in)}.card .ic.out{background:var(--out-soft);color:var(--out)}
.card .bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .lbl{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-2)}
.card .dt{margin-left:auto;color:var(--ink-3);font-size:13px}
.card .subj{font-weight:600;font-size:15px;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:13px;color:var(--ink-3);display:flex;gap:4px 14px;flex-wrap:wrap}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.fbtn svg.i{width:14px;height:14px}
.more{display:block;margin:14px auto 0}
.mini{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.mini:first-child{border-top:0}.mini:hover{background:var(--surface-2)}
.mini .subj{font-size:14px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .note{margin-top:2px}

/* ---------- events ---------- */
.day{display:grid;grid-template-columns:64px 1fr;gap:14px;margin-bottom:16px}
.dbox{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 4px;height:max-content;position:sticky;top:8px}
.dbox small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.dbox b{display:block;font-size:24px;line-height:1.15}
.dbox.today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.dbox.today small{color:inherit;opacity:.85}
.evs{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.ev:hover{border-color:var(--c)}
.ev .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .tm{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.ev .sj{font-weight:600;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.ev .mt{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.ev .mt span{display:inline-flex;gap:4px;align-items:center}.ev .mt svg.i{width:14px;height:14px}
.ev .nt{margin-left:auto;font-size:12px;color:var(--ink-3);display:inline-flex;gap:4px;align-items:center}
.ev .nt svg.i{width:14px;height:14px}.ev .nt.sent{color:var(--ok)}
.urow{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.urow:first-child{border-top:0}.urow:hover{background:var(--surface-2)}
.urow .d{width:46px;text-align:center;flex:none}.urow .d b{display:block;font-size:19px;line-height:1.1}.urow .d small{font-size:11.5px;color:var(--ink-3)}
.urow .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.urow .x{min-width:0;flex:1}.urow .x b{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:40;animation:fi .15s}
.drawer{position:fixed;z-index:41;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:si .2s ease-out}
@keyframes fi{from{opacity:0}}@keyframes si{from{transform:translateX(30px);opacity:.4}}
@media (max-width:640px){.drawer{top:auto;height:92vh;width:100%;border-radius:20px 20px 0 0;animation:su .22s ease-out}@keyframes su{from{transform:translateY(40px);opacity:.5}}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh b{font-size:16px}
.dh .x{margin-left:auto;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.db{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px;flex:1}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.db h2{margin:0;font-size:19px;line-height:1.45}
dl{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;margin:0;font-size:14.5px}
dt{color:var(--ink-3);font-size:13.5px}dd{margin:0;overflow-wrap:anywhere}
.sec h3{font-size:12.5px;letter-spacing:.04em;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.att{display:flex;flex-direction:column;gap:8px}
.att a{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-decoration:none;color:var(--ink)}
.att a:hover{border-color:var(--accent)}.att a b{flex:1;font-weight:600}
.att .fi{width:34px;height:34px;border-radius:9px;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.warnbox{border-radius:12px;padding:10px 14px;font-size:13.5px;background:var(--amber-soft);color:var(--amber)}
pre.msg{white-space:pre-wrap;background:#E7F6E1;color:#13231A;border-radius:16px 16px 16px 4px;padding:14px;font-family:var(--f);font-size:14px;line-height:1.6;margin:0}
@media (prefers-color-scheme:dark){pre.msg{background:#1F3A28;color:#E2F3E7}}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.form.card2{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:15px}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea{resize:vertical}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:1/-1}
.form h3{grid-column:1/-1;margin:6px 0 -4px;font-size:13px;color:var(--ink-3);letter-spacing:.04em;font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.f .seg{align-self:flex-start}
.pills button[aria-pressed="true"]{background:var(--cs,var(--accent-soft));border-color:var(--c,var(--accent));color:var(--c,var(--accent));font-weight:600}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none;margin:0;cursor:pointer}
.switch input:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--accent)}.switch input:checked:after{left:21px}
.nextbox{display:flex;gap:10px;flex-wrap:wrap}
.nextbox div{flex:1;min-width:140px;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.nextbox small{color:var(--ink-3);font-size:12.5px}.nextbox b{display:block;font-family:var(--mono);font-size:18px}
.done{text-align:center;padding:30px 20px}
.done .ok{width:60px;height:60px;border-radius:50%;background:var(--in-soft);color:var(--in);display:grid;place-items:center;margin:0 auto 10px}
.done .ok svg{width:30px;height:30px}
.done .big{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--in);margin:6px 0}
@media (max-width:640px){.ph h1{font-size:21px}.ph .act{width:100%}.ph .act .btn{padding:7px 11px;font-size:13px}.ph .act .btn.primary{margin-left:auto}.day{grid-template-columns:52px 1fr;gap:10px}.dbox{top:62px}.dbox b{font-size:20px}.ev .nt{margin-left:0;width:100%}.form{grid-template-columns:1fr 1fr}.c2,.c3,.c4{grid-column:span 1}.wide{grid-column:1/-1}dl{grid-template-columns:96px 1fr}}

/* ---------- LINE settings ---------- */
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}.srow .x{flex:1;min-width:0}.srow .x small{display:block;color:var(--ink-3);font-size:12.5px}
.sic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.sic.ok{background:var(--in-soft);color:var(--ok)}.sic.bad{background:var(--rose-soft);color:var(--crit)}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.copy{display:flex;gap:8px}.copy input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;font-family:var(--mono)}
/* ---------- gate (หน้าใส่รหัส) ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gcard{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 40px rgba(20,27,45,.08);overflow:hidden}
.gtop{background:linear-gradient(120deg,#2952CC,#6C4BD5);color:#fff;padding:28px 26px 24px;position:relative;overflow:hidden}
.gtop:after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.gtop .mk{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.gtop h1{margin:0;font-size:22px;line-height:1.3}.gtop p{margin:4px 0 0;opacity:.85;font-size:14px}
.gbody{padding:22px 26px 26px;display:flex;flex-direction:column;gap:14px}
.gbody .btn{justify-content:center;padding:12px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;cursor:pointer;text-decoration:underline}
</style>
</head>

</main>

    <div class="topbar"><div class="mk">สบ</div><b>สารบรรณออนไลน์</b><span class="role" id="roleTop"></span><button class="btn sm" data-logout style="margin-left:6px">ออก</button></div>
    <main class="main" id="view"></main>
  </div>
</div>
<nav class="bnav" id="bNav" hidden></nav>
<div id="drawerHost"></div><div id="toastHost"></div>
<script>
/* ===================== ตั้งค่า (แก้บรรทัดเดียว) =====================
   URL เว็บแอปจาก Apps Script (ลงท้าย /exec ไม่ต้องมี ?k=)
   ================================================================== */
window.SARABAN_APP_URL = 'https://script.google.com/macros/s/AKfycbxvgC2Xm5MSYBy2LfN7scocibyiYNWriHbQvkJpxqP3gN-xH7OPLHRE4wgG12aIUkob0A/exec';
</script>
<script>
/* แสดงข้อผิดพลาดบนหน้าจอ (ไม่ต้องเปิด F12) */
window.addEventListener('error', function (e) {
  var v = document.getElementById('view');
  if (v) v.insertAdjacentHTML('afterbegin', '<div style="background:#FCE7EC;color:#9B1C3A;border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:14px"><b>เกิดข้อผิดพลาดในหน้าแอป</b><br>' +
    String(e.message || e).replace(/</g, '&lt;') + (e.lineno ? ' (บรรทัด ' + e.lineno + ':' + e.colno + ')' : '') + '<br><code style="font-size:12px;white-space:pre-wrap;word-break:break-all">' +
    (function () { try { var L = document.documentElement.outerHTML.split('\n'); var c = Math.max(0, (e.colno || 1) - 50); return [3, 2, 1].map(function (d) { return (L[e.lineno - d] || '').slice(c, c + 120); }).join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;'); } catch (x) { return ''; } })() +
    '</code><br>แคปหน้าจอนี้ส่งให้ผู้ดูแลระบบ</div>');
});
</script>
<script>
(function () {
'use strict';
/* ค่าเริ่มต้นจาก Apps Script (ถ้าเปิดไฟล์นี้นอก Apps Script จะเข้าโหมดพรีวิว ไม่ error) */
const APP_URL = String(window.SARABAN_APP_URL || '').replace(/[?#].*$/, '');
const PREVIEW = false;
const BOOT = { q: '' };
let K = '', ADMIN = false;
const STORE = 'saraban.key';
const keyFrom = input => { const x = String(input || '').trim(); const m = x.match(/[?#&]k=([A-Za-z0-9]{6,40})/); if (m) return m[1]; return /^[A-Za-z0-9]{6,40}$/.test(x) ? x : ''; };
const store = {
  get() { try { return localStorage.getItem(STORE) || sessionStorage.getItem(STORE) || keyFrom(localStorage.getItem('saraban.link') || ''); } catch (e) { return ''; } },
  set(v, remember) { try { (remember ? localStorage : sessionStorage).setItem(STORE, v); } catch (e) { } },
  clear() { try { localStorage.removeItem(STORE); sessionStorage.removeItem(STORE); localStorage.removeItem('saraban.link'); sessionStorage.removeItem('saraban.link'); } catch (e) { } }
};
const TYPES = ['คุมสอบ', 'สอน', 'ประชุม', 'ประกาศ', 'อื่นๆ'];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thD = s => String(s || '').replace(/[\u0E50-\u0E59]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-4-1L3 20l1.5-4A8.5 8.5 0 1 1 21 11.5z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  clip:'<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  mega:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M15 8l2 2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
};
const ic = (n, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
async function run(fn, ...args) {
  let res;
  try {
    res = await fetch(APP_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: fn, args: args }) });
  } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ต หรือการตั้งค่า Deploy (ผู้มีสิทธิ์เข้าถึง: ทุกคน)'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — ตรวจว่าวาง Code.gs ล่าสุดแล้ว Deploy เวอร์ชันใหม่ และ APP_URL ถูกต้อง'); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'เกิดข้อผิดพลาด');
  return j.data;
}
function toast(m) { $('#toastHost').innerHTML = '<div class="toast" role="status">' + esc(m) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(() => $('#toastHost').innerHTML = '', 3500); }
const errMsg = e => (e && e.message) || String(e);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const thShort = s => { const d = pd(s); return TH_D[d.getDay()] + ' ' + d.getDate() + ' ' + TH_M[d.getMonth()]; };
const thLong = s => { const d = pd(s); return thShort(s) + ' ' + (d.getFullYear() + 543); };
const addD = (s, n) => iso(new Date(pd(s).getTime() + n * 864e5));

/* ======================= state & navigation ======================= */
const S = { meta: null, home: null, view: 'home', q: BOOT.q || '', year: '', dir: '', att: false, limit: 30, items: [], total: 0, seq: 0, evScope: 'upcoming', events: [] };
const NAV_ALL = [
  { id: 'home', label: 'ภาพรวม', icon: 'home' },
  { id: 'letters', label: 'หนังสือ', icon: 'file' },
  { id: 'events', label: 'งาน & แจ้งเตือน', short: 'งาน', icon: 'cal' },
  { id: 'new', label: 'ลงทะเบียน', icon: 'plus', admin: true },
  { id: 'line', label: 'ตั้งค่า LINE', short: 'LINE', icon: 'chat', admin: true }
];
let NAV = [];
function renderNav() {
  NAV = NAV_ALL.filter(n => ADMIN || !n.admin);
  const b = n => `<button data-nav="${n.id}" ${S.view === n.id ? 'aria-current="page"' : ''}>${ic(n.icon)}<span>${n.label}</span></button>`;
  $('#sideNav').innerHTML = NAV.map(b).join('');
  $('#bNav').innerHTML = NAV.map(n => `<button data-nav="${n.id}" ${S.view === n.id ? 'aria-current="page"' : ''}>${ic(n.icon)}<span>${n.short || n.label}</span></button>`).join('');
  const r = ADMIN ? `<span class="role admin">${ic('key')} ผู้ดูแล</span>` : `<span class="role">${ic('eye')} ดูอย่างเดียว</span>`;
  $('#roleSide').outerHTML = r.replace('class="role', 'id="roleSide" class="role'); $('#roleTop').outerHTML = r.replace('class="role', 'id="roleTop" class="role');
  $('#sideNote').innerHTML = esc(ADMIN ? 'ลงทะเบียน แนบไฟล์ และจัดการแจ้งเตือนได้' : 'ค้นหาและเปิดอ่านได้ แก้ไขไม่ได้') + '<br><button class="linkbtn" data-logout>ออกจากระบบในเครื่องนี้</button>';
}
function go(v, opt) {
  if (!NAV.some(n => n.id === v)) v = 'home';
  S.view = v; renderNav(); closeDrawer(); window.scrollTo(0, 0);
  ({ home: viewHome, letters: viewLetters, events: viewEvents, new: viewNew, line: viewLine })[v](opt || {});
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-logout]')) { e.preventDefault(); logout(); return; }
  const n = e.target.closest('[data-nav]'); if (n) { e.preventDefault(); go(n.dataset.nav); return; }
  if (e.target.closest('[data-close]')) { closeDrawer(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-open]')) e.target.click();
});

/* ======================= drawer ======================= */
function openDrawer(title, body, foot) {
  $('#drawerHost').innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="dh"><b>${title}</b><button class="x" data-close aria-label="ปิด">${ic('x')}</button></div>
    <div class="db">${body}</div>${foot ? `<div class="df">${foot}</div>` : ''}</aside>`;
}
function closeDrawer() { $('#drawerHost').innerHTML = ''; }

/* ======================= helpers: letters ======================= */
function hl(t) {
  const s = esc(t); const terms = thD(S.q).toLowerCase().split(/\s+/).filter(x => x.length > 1).map(x => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return s; try { return s.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>'); } catch (e) { return s; }
}
const fileBtns = it => it.files.map((u, i) => `<a class="fbtn" href="${esc(u)}" rel="noopener" onclick="event.stopPropagation()">${ic('clip')} ${it.files.length > 1 ? 'ไฟล์ ' + (i + 1) : 'เปิดหนังสือ'}</a>`).join('');
function letterCard(it, i) {
  const out = it.dir === 'ส่ง';
  const tags = [it.cat && `<span class="chip">${esc(it.cat)}</span>`, it.urg && it.urg !== 'ปกติ' && `<span class="chip warn">${esc(it.urg)}</span>`, it.sec && it.sec !== 'ปกติ' && `<span class="chip crit">${esc(it.sec)}</span>`].filter(Boolean).join('');
  return `<article class="card" data-open data-i="${i}" tabindex="0">
    <div class="ic ${out ? 'out' : 'in'}">${ic(out ? 'send' : 'inbox')}</div>
    <div class="bd"><div class="top"><span class="chip ${out ? 'out' : 'in'}">${out ? 'ส่ง' : 'รับ'}</span><span class="lbl">${hl(it.label || 'ไม่มีเลข')}</span><span class="dt">${esc(it.dateTH)}</span></div>
    <div class="subj">${hl(it.subject)}</div>
    <div class="meta"><span>ที่ ${hl(it.book || '—')}</span><span>${hl(out ? 'ถึง ' + (it.to || '—') : 'จาก ' + (it.from || '—'))}</span>${it.owner ? `<span>${hl(it.owner)}</span>` : ''}</div>
    ${tags || it.files.length ? `<div class="tags">${tags}${fileBtns(it)}</div>` : ''}</div></article>`;
}
function miniLetter(it, i) {
  const out = it.dir === 'ส่ง';
  return `<div class="mini" data-open data-ri="${i}" tabindex="0"><span class="chip ${out ? 'out' : 'in'}">${out ? 'ส่ง' : 'รับ'}</span>
    <div style="min-width:0;flex:1"><div class="subj">${esc(it.subject)}</div><div class="note"><span class="mono">${esc(it.label || '—')}</span> · ${esc(it.dateTH)}</div></div>
    ${it.files.length ? `<span style="color:var(--ink-3)">${ic('clip')}</span>` : ''}</div>`;
}
function openLetter(it) {
  const out = it.dir === 'ส่ง';
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  const loc = [it.room, it.cab && 'ตู้ ' + it.cab, it.shelf && 'ชั้น ' + it.shelf, it.folder && 'แฟ้ม ' + it.folder].filter(Boolean).join(' · ');
  const files = it.files.map((u, i) => `<a href="${esc(u)}" rel="noopener"><span class="fi">${ic('file')}</span><b>ไฟล์ที่ ${i + 1}</b><span class="note">เปิดใน Drive</span>${ic('ext')}</a>`).join('');
  openDrawer(`<span class="chip ${out ? 'out' : 'in'}">${out ? 'หนังสือส่ง' : 'หนังสือรับ'}</span> <span class="mono" style="margin-left:6px">${esc(it.label || '')}</span>`,
    `<h2>${esc(it.subject)}</h2>

    ${ADMIN && it.chk ? `<div class="warnbox"><b>ควรตรวจสอบ:</b> ${esc(it.chk)}</div>` : ''}
    <div class="sec"><h3>เอกสารแนบ</h3><div class="att">${files || '<span class="note">ยังไม่มีไฟล์แนบ' + (ADMIN && it.old ? ' · ไฟล์เดิมเคยอยู่ที่ ' + esc(it.old) : '') + '</span>'}</div>
      ${ADMIN ? `<label class="drop" id="upDrop" style="margin-top:10px">${ic('upload')}<span style="flex:1">เลือกไฟล์ / ลากมาวาง เพื่อแนบเพิ่ม</span><input id="upFiles" type="file" multiple accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx" hidden></label>` : (files ? '<p class="note" style="margin:8px 0 0">เปิดไฟล์ไม่ได้? เข้าสู่ระบบ Google ด้วยอีเมลที่ผู้ดูแลเพิ่มให้</p>' : '')}</div>
    ${ADMIN ? `<p class="note" style="margin:0">แถวที่ ${it.row} ในชีต${S.meta && S.meta.sheetUrl ? ` · <a href="${esc(S.meta.sheetUrl + '&range=A' + it.row)}">เปิดแถวในชีต</a>` : ''}${it.src ? '<br>ที่มา: ' + esc(it.src) : ''}</p>` : ''}`);
  if (!ADMIN) return;
  const inp = $('#upFiles'), drop = $('#upDrop');
  const up = async fs => {
    if (!fs.length) return;
    drop.innerHTML = '<span class="spin"></span> กำลังอัปโหลด ' + fs.length + ' ไฟล์…';
    try { const rec = await run('api_attach', K, it.row, await readFiles(fs)); Object.assign(it, rec); toast('แนบไฟล์แล้ว'); openLetter(it); if (S.view === 'letters') renderLetters(); }
    catch (e) { toast('อัปโหลดไม่สำเร็จ: ' + errMsg(e)); openLetter(it); }
  };
  inp.onchange = () => up([...inp.files]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => { e.preventDefault(); up([...e.dataTransfer.files]); };
}
function readFiles(fs) {
  return Promise.all(fs.map(f => new Promise((ok, no) => {
    if (f.size > 40 * 1024 * 1024) { no(new Error(f.name + ' ใหญ่เกิน 40 MB')); return; }
    const r = new FileReader(); r.onload = () => ok({ name: f.name, mime: f.type, data: String(r.result).split(',')[1] }); r.onerror = () => no(r.error); r.readAsDataURL(f);
  })));
}

  $('#status').textContent = (S.q ? `ผลค้นหา “${S.q}” · ` : '') + `พบ ${S.total.toLocaleString()} เรื่อง` + (S.total > S.items.length ? ` · แสดง ${S.items.length} เรื่องล่าสุด` : '');

    : `<div class="empty">${ic('search')}ไม่พบเรื่องที่ค้นหา<br>ลองเลือก “ทุกปี” หรือใช้คำที่สั้นลง</div>`;
}

      ${ADMIN ? `<div class="act"><button class="btn" id="evPrev">${ic('eye')} ตัวอย่างพรุ่งนี้</button><button class="btn" id="evAnn">${ic('mega')} ส่งประกาศ</button><button class="btn primary" id="evAdd">${ic('plus')} เพิ่มงาน</button></div>` : ''}</div>
    <div class="toolbar" style="flex-direction:row;align-items:center"><span class="seg" id="evSeg">${[['upcoming', 'กำลังมาถึง'], ['past', 'ที่ผ่านมา']].map(([v, l]) => `<button data-s="${v}" aria-pressed="${S.evScope === v}">${l}</button>`).join('')}</span>
      <span class="note" id="evCount" style="margin-left:auto"></span></div>
    <div id="evList"><div class="sk" style="height:70px"></div><div class="sk" style="height:70px;margin-top:10px"></div></div>`;
  if (ADMIN) { $('#evAdd').onclick = () => eventForm(); $('#evAnn').onclick = announceDrawer; $('#evPrev').onclick = previewDrawer; }
  $('#evSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.evScope = b.dataset.s; $('#evSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); loadEvents(); };
  $('#evList').onclick = e => { const c = e.target.closest('[data-ei]'); if (c) openEvent(S.events[+c.dataset.ei]); if (e.target.closest('#evEmptyAdd')) eventForm(); };
  loadEvents();
}
async function loadEvents() {
  try {
    const list = S.events = await run('api_events', K, S.evScope);
    if (S.view !== 'events') return;
    $('#evCount').textContent = list.length + ' รายการ';
    if (!list.length) { $('#evList').innerHTML = `<div class="panel empty">${ic('cal')}${S.evScope === 'past' ? 'ยังไม่มีงานที่ผ่านมา' : 'ยังไม่มีงานที่กำลังมาถึง'}${ADMIN && S.evScope !== 'past' ? '<br><button class="btn primary sm" id="evEmptyAdd" style="margin-top:12px">' + ic('plus') + ' เพิ่มงานแรก</button>' : ''}</div>`; return; }
    const today = iso(new Date()); const groups = [];
    list.forEach((ev, i) => { let g = groups[groups.length - 1]; if (!g || g.date !== ev.date) groups.push(g = { date: ev.date, items: [] }); g.items.push([ev, i]); });
    $('#evList').innerHTML = groups.map(g => { const d = pd(g.date);
      return `<div class="day"><div class="dbox ${g.date === today ? 'today' : ''}"><small>${g.date === today ? 'วันนี้' : TH_D[d.getDay()]}</small><b>${d.getDate()}</b><small>${TH_M[d.getMonth()]} ${String(d.getFullYear() + 543).slice(2)}</small></div>
      <div class="evs">${g.items.map(([ev, i]) => evCard(ev, i)).join('')}</div></div>`; }).join('');
  } catch (e) { $('#evList').innerHTML = `<div class="warnbox">${esc(errMsg(e))}</div>`; }
}

function viewLine() {
  $('#view').innerHTML = `<div class="ph"><div><h1>ตั้งค่า LINE & การแชร์</h1><p>สถานะการเชื่อม LINE OA ผู้รับแจ้งเตือน และลิงก์สำหรับผู้ดู</p></div>

    const q = s.quota; const pct = q && q.limit ? Math.min(100, Math.round(q.used / q.limit * 100)) : 0;
    $('#lnBody').innerHTML = `
      <section class="panel"><h2>${ic('chat')} การเชื่อม LINE OA</h2>
        ${row(s.token && s.tokenOk, s.token ? (s.tokenOk ? 'เชื่อม LINE OA แล้ว' : 'Token ใช้ไม่ได้') : 'ยังไม่ได้ใส่ Channel access token', s.token ? (s.tokenOk ? 'ส่งข้อความได้' : 'ออก token ใหม่ใน LINE Developers แล้วใส่ในชีต') : 'ชีต → เมนู 📁 สารบรรณ → LINE: ตั้ง Channel access token')}
        ${row(s.recipients.length > 0, 'ผู้รับแจ้งเตือน ' + s.recipients.length + ' ปลายทาง', s.recipients.length ? s.recipients.map(r => (r.kind === 'user' ? '👤 ' : '👥 ') + esc(r.name)).join(' · ') : 'ชีต → เมนู 📣 แจ้งเตือน LINE → ② เพิ่มผู้รับ')}
        <div class="srow"><span class="sic ${s.auto ? 'ok' : ''}">${ic('clock')}</span><div class="x"><b>แจ้งเตือนอัตโนมัติทุกเช้า</b><small>${s.auto ? 'เปิดอยู่ · ส่งราว ' + s.hour + ':00–' + s.hour + ':59 น. (วันไม่มีงาน ไม่ส่ง)' : 'ปิดอยู่'}</small></div>
          <label class="switch" aria-label="เปิดปิดแจ้งเตือนอัตโนมัติ"><input type="checkbox" id="autoSw" ${s.auto ? 'checked' : ''}></label></div>
        <div class="pb" style="border-top:1px solid var(--line)"><button class="btn sm" id="lnNow">${ic('send')} ส่งแจ้งเตือนรอบวันนี้ทันที</button></div>
      </section>
      <section class="panel"><h2>${ic('bell')} โควตาข้อความเดือนนี้</h2><div class="pb">
        ${q ? `<b style="font-size:26px">${q.used.toLocaleString()}</b> <span class="note">${q.limit ? '/ ' + q.limit.toLocaleString() + ' ข้อความ' : 'ข้อความ (ไม่จำกัด)'}</span>${q.limit ? `<div class="meter"><i style="width:${pct}%;${pct > 80 ? 'background:var(--crit)' : ''}"></i></div><span class="note">เหลือ ${Math.max(0, q.limit - q.used).toLocaleString()} ข้อความ</span>` : ''}`
          : '<span class="note">ยังอ่านโควตาไม่ได้ (ต้องเชื่อม LINE OA ก่อน)</span>'}
        <p class="note" style="margin:12px 0 0">ส่งถึงตัวเอง 1 ครั้ง = 1 ข้อความ · ส่งเข้ากลุ่ม 1 ครั้ง = จำนวนสมาชิกในกลุ่ม · คำสั่ง <b>งานวันนี้ / งานพรุ่งนี้</b> และผลค้นหาใน LINE เป็นการตอบกลับ ไม่นับโควตา</p></div>
      </section>
      <section class="panel"><h2>${ic('users')} แชร์ให้คนอื่นดู (แก้ไขไม่ได้)</h2><div class="pb" style="display:flex;flex-direction:column;gap:12px">
        <div><div class="note" style="margin-bottom:6px">ลิงก์ผู้ดู — ส่งให้อาจารย์/เจ้าหน้าที่</div>${s.viewUrl ? `<div class="copy"><input readonly value="${esc(s.viewUrl)}" id="vUrl"><button class="btn sm" id="vCopy">${ic('copy')} คัดลอก</button></div>` : '<span class="note">ชีต → เมนู 📁 สารบรรณ → ① ตั้งค่าเริ่มต้น เพื่อสร้างลิงก์</span>'}</div>
        <div class="note">ผู้ดูที่เปิดไฟล์แนบได้: <b>${s.viewers}</b> คน · ผู้ใช้ LINE ที่ค้นหาได้: <b>${s.lineUsers}</b> คน · ผู้ประกาศผ่าน LINE: <b>${s.admins}</b> คน<br>เพิ่ม/ลบได้ที่เมนูในชีต (👁 ผู้ดู, LINE: เพิ่มผู้ใช้, ③ เพิ่มผู้ประกาศ)</div>
        ${s.webhook ? `<div><div class="note" style="margin-bottom:6px">Webhook URL สำหรับ LINE Developers</div><div class="copy"><input readonly value="${esc(s.webhook)}" id="wUrl"><button class="btn sm" id="wCopy">${ic('copy')}</button></div></div>` : ''}
      </div></section>`;
    const cp = (btn, inp) => { if ($(btn)) $(btn).onclick = async () => { try { await navigator.clipboard.writeText($(inp).value); toast('คัดลอกแล้ว'); } catch (e) { $(inp).select(); toast('กด Ctrl+C เพื่อคัดลอก'); } }; };
    cp('#vCopy', '#vUrl'); cp('#wCopy', '#wUrl');
    $('#lnNow').onclick = sendNow;
    $('#autoSw').onchange = async e => {
      const on = e.target.checked; e.target.disabled = true;
      try { const r = await run('api_setAuto', K, on); toast(r ? 'เปิดแจ้งเตือนอัตโนมัติแล้ว' : 'ปิดแจ้งเตือนอัตโนมัติแล้ว'); loadLine(); }

    };
  } catch (e) { $('#lnBody').innerHTML = `<div class="warnbox">${esc(errMsg(e))}</div>`; }
}

/* ======================= start ======================= */
function showGate(msg) {
  document.querySelector('.app').hidden = true; $('#bNav').hidden = true; $('#gate').hidden = false;
  $('#gErr').textContent = msg || ''; setTimeout(() => $('#gCode').focus(), 50);
}
async function enter(key, remember) {
  K = key;
  $('#gate').hidden = true; document.querySelector('.app').hidden = false; $('#bNav').hidden = false;
  $('#view').innerHTML = '<div class="panel pb"><span class="spin"></span> กำลังเชื่อมต่อ…</div>';
  try {
    const m = await run('api_meta', K);
    if (remember !== undefined) store.set(key, remember);
    S.meta = m; ADMIN = m.role === 'admin';
    renderNav(); go(S.q ? 'letters' : 'home');
  } catch (e) {
    const msg = errMsg(e);
    if (/ลิงก์ไม่ถูกต้อง|รหัสถูกเปลี่ยน/.test(msg)) { store.clear(); K = ''; showGate('รหัสไม่ถูกต้อง หรือถูกเปลี่ยนแล้ว'); }
    else $('#view').innerHTML = `<div class="warnbox"><b>เชื่อมต่อไม่ได้</b><br>${esc(msg)}<br><button class="btn sm" id="retry" style="margin-top:10px">ลองใหม่</button> <button class="btn sm" data-logout>ใส่รหัสใหม่</button></div>`, $('#retry').onclick = () => enter(key, remember);
  }
}
function logout() {
  if (K && !confirm('ออกจากระบบในเครื่องนี้? ครั้งหน้าต้องใส่รหัสใหม่')) return;
  store.clear(); K = ''; ADMIN = false; closeDrawer(); $('#gCode').value = ''; showGate();
}
$('#gForm').onsubmit = e => {
  e.preventDefault();
  const k = keyFrom($('#gCode').value);
  if (!k) { $('#gErr').textContent = 'รหัสต้องเป็นตัวอักษรอังกฤษหรือตัวเลข 6–40 ตัว (หรือวางลิงก์ที่มี k=)'; return; }
  enter(k, $('#gRemember').checked);
};
(function start() {
  if (!APP_URL) { showGate('ยังไม่ได้ตั้งค่า SARABAN_APP_URL ในไฟล์ index.html'); return; }
  const h = location.hash.replace(/^#/, '');
  const hk = (h.match(/(?:^|&)k=([A-Za-z0-9]{6,40})/) || [])[1];
  const hq = (h.match(/(?:^|&)q=([^&]*)/) || [])[1];
  if (hq) { try { S.q = decodeURIComponent(hq); } catch (e) { } }
  if (h) history.replaceState(null, '', location.pathname + location.search);
  if (hk) enter(hk, true);
  else { const s = store.get(); if (s) enter(s); else showGate(); }
})();
})();
</script>
