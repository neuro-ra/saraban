<!DOCTYPE html>
<html lang="th">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2952CC">
<title>สารบรรณออนไลน์ · ประสาทวิทยา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232952CC'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E0%B8%AA%E0%B8%9A%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#F0F2F7;--line:#E2E6EE;--ink:#141B2D;--ink-2:#4A5468;--ink-3:#8590A5;
  --accent:#2952CC;--accent-ink:#FFFFFF;--accent-soft:#E8EEFC;
  --in:#0E8A5F;--in-soft:#E3F5EE;--out:#5B4BD5;--out-soft:#EDEBFC;
  --amber:#B86E00;--amber-soft:#FDF1DC;--violet:#7A3FC9;--violet-soft:#F1E9FC;--blue:#1F6FD1;--blue-soft:#E5F0FC;
  --rose:#C9264B;--rose-soft:#FCE7EC;--slate:#5B6577;--slate-soft:#EEF0F4;--ok:#0E8A5F;--warn:#B86E00;--crit:#C9264B;
  --radius:14px;--shadow:0 1px 2px rgba(20,27,45,.05),0 4px 16px rgba(20,27,45,.05);
  --f:"Noto Sans Thai","Sarabun","Leelawadee UI",Tahoma,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Noto Sans Thai","Sarabun",Tahoma,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0D1220;--surface:#151C2C;--surface-2:#1C2436;--line:#283248;--ink:#E6EAF2;--ink-2:#A9B3C6;--ink-3:#77829A;
  --accent:#7EA2FF;--accent-ink:#0B1530;--accent-soft:#1D2A4D;--in:#4FCB9B;--in-soft:#14302A;--out:#A79BFF;--out-soft:#26214A;
  --amber:#F0B34E;--amber-soft:#3A2C12;--violet:#C49BFF;--violet-soft:#2E2147;--blue:#7DB4FF;--blue-soft:#172B47;
  --rose:#FF8DA6;--rose-soft:#3F1B27;--slate:#AAB4C6;--slate-soft:#232B3B;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(to right,var(--surface) 247px,var(--line) 247px,var(--line) 248px,transparent 248px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#6C4BD5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.logo b{display:block;font-size:15.5px;line-height:1.2}.logo small{color:var(--ink-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--ink-2);text-align:left;font-size:15px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;padding:10px 8px;font-size:12.5px;color:var(--ink-3)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.role.admin{background:var(--accent-soft);color:var(--accent)}
.main{min-width:0;padding:28px 32px 90px;max-width:1180px;width:100%}
.topbar{display:none}
.bnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:none}.side{display:none}
  .main{padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line)}
  .topbar .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6C4BD5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
  .topbar b{font-size:15px}.topbar .role{margin-left:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:6px 2px;border-radius:10px;font-weight:500}
  .bnav button[aria-current="page"]{color:var(--accent);font-weight:600}
  .bnav button[aria-current="page"] svg{background:var(--accent-soft);border-radius:99px;padding:3px 14px;width:50px;height:28px}
}

/* ---------- common ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.ph h1{font-size:24px;margin:0;line-height:1.25;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--ink-3);font-size:14px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg.i{width:17px;height:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel>h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h2 a,.panel>h2 button.link{margin-left:auto;font-size:13px;font-weight:500;border:0;background:none;color:var(--accent);padding:0}
.pb{padding:14px 16px}
.empty{text-align:center;color:var(--ink-3);padding:36px 12px;font-size:14px}
.empty svg{width:34px;height:34px;opacity:.5;display:block;margin:0 auto 8px}
.note{font-size:13px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--slate-soft);color:var(--slate);white-space:nowrap}
.chip.in{background:var(--in-soft);color:var(--in)}.chip.out{background:var(--out-soft);color:var(--out)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}.chip.crit{background:var(--rose-soft);color:var(--rose)}
.chip.ok{background:var(--in-soft);color:var(--ok)}
.t-คุมสอบ{--c:var(--amber);--cs:var(--amber-soft)}.t-สอน{--c:var(--violet);--cs:var(--violet-soft)}
.t-ประชุม{--c:var(--blue);--cs:var(--blue-soft)}.t-ประกาศ{--c:var(--rose);--cs:var(--rose-soft)}
.t-อื่นๆ,.t-{--c:var(--slate);--cs:var(--slate-soft)}
.chip.type{background:var(--cs);color:var(--c)}
mark{background:color-mix(in srgb,#FFC83D 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 40%,var(--surface)),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:900px){.toast{bottom:96px}}

/* ---------- home ---------- */
.hero{border-radius:20px;padding:24px;background:linear-gradient(120deg,var(--accent),#6C4BD5);color:#fff;position:relative;overflow:hidden;margin-bottom:18px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.85;font-size:13.5px}.hero h1{margin:2px 0 14px;font-size:24px;line-height:1.3}
.hsearch{display:flex;align-items:center;gap:10px;background:#fff;color:#141B2D;border-radius:12px;padding:0 6px 0 14px;max-width:620px;position:relative;z-index:1}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:13px 0;font-size:16px;color:#141B2D}
.hsearch .btn{background:var(--accent);color:#fff;border:0}
@media (prefers-color-scheme:dark){.hsearch .btn{color:#fff;background:#2952CC}}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.qa button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:6px 14px;font-weight:500;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.qa button:hover{background:rgba(255,255,255,.22)}.qa svg.i{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}.stat small{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media (max-width:1050px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.hero{padding:18px}.hero h1{font-size:20px}}
.alert{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:14px;margin-bottom:16px}
.alert b{color:var(--ink)}.alert .btn{margin-left:auto}

/* ---------- letters ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:2px 0 12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.toolbar{top:53px}}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.search input::-webkit-search-cancel-button{display:none}
.search svg{color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;font-size:13.5px;border-radius:99px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer}
.tgl:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tgl input{display:none}
.xbtn{border:0;background:var(--surface-2);color:var(--ink-3);width:26px;height:26px;border-radius:50%;font-size:12px;flex:none}
.status{font-size:13px;color:var(--ink-3);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.card .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.card .ic.in{background:var(--in-soft);color:var(--in)}.card .ic.out{background:var(--out-soft);color:var(--out)}
.card .bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .lbl{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-2)}
.card .dt{margin-left:auto;color:var(--ink-3);font-size:13px}
.card .subj{font-weight:600;font-size:15px;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:13px;color:var(--ink-3);display:flex;gap:4px 14px;flex-wrap:wrap}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.fbtn svg.i{width:14px;height:14px}
.more{display:block;margin:14px auto 0}
/* rows v3 */
.list{gap:0}
.lgrp{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.mhead{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.mhead span{margin-left:auto;font-weight:500;color:var(--ink-3)}
.lrow{display:flex;gap:14px;align-items:center;padding:12px 14px 12px 12px;border-top:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.mhead+.lrow{border-top:0}
.lrow:hover{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.lrow::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.lrow.in{--c:var(--in);--cs:var(--in-soft)}.lrow.out{--c:var(--out);--cs:var(--out-soft)}
.dblk{flex:none;width:50px;text-align:center;border-radius:12px;background:var(--cs);color:var(--c);padding:5px 0 4px;line-height:1.1}
.dblk b{display:block;font-size:19px;font-weight:700}.dblk span{display:block;font-size:11.5px;font-weight:600}
.dblk small{display:block;font-size:10.5px;opacity:.75;margin-top:1px}
.lrow .bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.lrow .top{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.lrow .kind{font-weight:700;color:var(--c)}
.lrow .lbl{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.lrow .subj{font-weight:600;font-size:15px;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow .meta{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .end{flex:none;display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.lrow .fcount{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 8px}
.lrow .fcount svg.i{width:14px;height:14px}
.lrow .chev svg.i{width:18px;height:18px}
@media (max-width:640px){.lrow{gap:11px;padding:11px 10px 11px 10px}.dblk{width:44px}.lrow .chev{display:none}.lrow .subj{font-size:14.5px}}
.ychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 2px;-webkit-mask-image:linear-gradient(to right,#000 92%,transparent)}
.ychips::-webkit-scrollbar{display:none}
.ychips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.ychips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.lrow:first-child{border-top:0}
.grid2>*,.stats>*,.lgrp,.list,.app>*,#view{min-width:0}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.sync{position:fixed;top:12px;right:14px;z-index:40;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2);transition:opacity .4s}
.sync.ok{color:var(--ok)}.sync.hide{opacity:0;pointer-events:none}
.sync .spin{width:12px;height:12px;border-width:2px}
@media (max-width:900px){.sync{top:auto;bottom:84px;right:50%;transform:translateX(50%)}}
.mini{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.mini:first-child{border-top:0}.mini:hover{background:var(--surface-2)}
.mini .subj{font-size:14px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .note{margin-top:2px}

/* ---------- events ---------- */
.day{display:grid;grid-template-columns:64px 1fr;gap:14px;margin-bottom:16px}
.dbox{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 4px;height:max-content;position:sticky;top:8px}
.dbox small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.dbox b{display:block;font-size:24px;line-height:1.15}
.dbox.today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.dbox.today small{color:inherit;opacity:.85}
.evs{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.ev:hover{border-color:var(--c)}
.ev .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .tm{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.ev .sj{font-weight:600;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.ev .mt{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.ev .mt span{display:inline-flex;gap:4px;align-items:center}.ev .mt svg.i{width:14px;height:14px}
.ev .nt{margin-left:auto;font-size:12px;color:var(--ink-3);display:inline-flex;gap:4px;align-items:center}
.ev .nt svg.i{width:14px;height:14px}.ev .nt.sent{color:var(--ok)}
.urow{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.urow:first-child{border-top:0}.urow:hover{background:var(--surface-2)}
.urow .d{width:46px;text-align:center;flex:none}.urow .d b{display:block;font-size:19px;line-height:1.1}.urow .d small{font-size:11.5px;color:var(--ink-3)}
.urow .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}

async function run(fn, ...args) {
  let res;
  try {
    res = await fetch(APP_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: fn, args: args }) });
  } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ต หรือการตั้งค่า Deploy (ผู้มีสิทธิ์เข้าถึง: ทุกคน)'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — ตรวจว่าวาง Code.gs ล่าสุดแล้ว Deploy เวอร์ชันใหม่ และ APP_URL ถูกต้อง'); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'เกิดข้อผิดพลาด');
  if (j.ver && S.ver && j.ver !== S.ver && j.pv === S.ver && fn !== 'api_boot') { S.ver = j.ver; saveCache(); }
  return j.data;
}

const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const thShort = s => { const d = pd(s); return TH_D[d.getDay()] + ' ' + d.getDate() + ' ' + TH_M[d.getMonth()]; };
const thLong = s => { const d = pd(s); return thShort(s) + ' ' + (d.getFullYear() + 543); };
const addD = (s, n) => iso(new Date(pd(s).getTime() + n * 864e5));

const IDB = {
  p: null,
  open() { return this.p || (this.p = new Promise((res, rej) => { const r = indexedDB.open('saraban', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) { } },
  async del(k) { try { const db = await this.open(); db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { } }
};
let PERSIST = false;
function saveCache() {
  clearTimeout(saveCache.t);

function sync(msg, kind) {
  let el = $('#sync'); if (!el) { el = document.createElement('div'); el.id = 'sync'; el.className = 'sync hide'; document.body.appendChild(el); }

function hl(t) {
  const s = esc(t); const terms = thD(S.q).toLowerCase().split(/\s+/).filter(x => x.length > 1).map(x => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return s; try { return s.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>'); } catch (e) { return s; }
}

/* เปิดไฟล์ผ่านแอป (ดึงจาก Drive ด้วยสิทธิ์ของระบบ) — ไม่ต้องล็อกอิน Google */
const FILE_URL = {};
async function openFile(u, btn) {
  const w = window.open('', '_blank');
  const show = (url, f) => {
    if (w && /^(application\/pdf|image\/|text\/plain)/.test(f.mime)) { w.location.href = url; return; }
    if (w) w.close();
    const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); toast('ดาวน์โหลด ' + f.name);
  };
  if (FILE_URL[u]) return show(FILE_URL[u].url, FILE_URL[u].f);
  if (w) { try { w.document.write('<meta charset="utf-8"><title>กำลังเปิดไฟล์…</title><body style="font-family:sans-serif;display:grid;place-items:center;height:90vh;color:#555">กำลังเปิดไฟล์… รอสักครู่</body>'); } catch (e) { } }
  const t = btn && btn.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังเปิด…'; }
  try {
    const f = await run('api_file', K, u);
    const bin = atob(f.data); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
    FILE_URL[u] = { url: url, f: { name: f.name, mime: f.mime } };
    show(url, f);
  } catch (e) { if (w) w.close(); toast(errMsg(e)); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = t; } }
}

function readFiles(fs) {
  return Promise.all(fs.map(f => new Promise((ok, no) => {
    if (f.size > 40 * 1024 * 1024) { no(new Error(f.name + ' ใหญ่เกิน 40 MB')); return; }
    const r = new FileReader(); r.onload = () => ok({ name: f.name, mime: f.type, data: String(r.result).split(',')[1] }); r.onerror = () => no(r.error); r.readAsDataURL(f);
  })));
}

/* ======================= ข้อมูลในเครื่อง (ค้นหาเร็ว ไม่ต้องรอเซิร์ฟเวอร์) ======================= */
const thDig = s => String(s == null ? '' : s).replace(/[\u0E50-\u0E59]/g, d => String(d.charCodeAt(0) - 0x0E50));
const normT = s => thDig(s).toLowerCase().replace(/\s+/g, ' ').trim();
function thDate(x) { if (!x) return ''; const p = String(x).split('-').map(Number); return p[2] + ' ' + TH_M[p[1] - 1] + ' ' + (p[0] + 543); }
function fixRec(o) {
  o.files = Array.isArray(o.files) ? o.files : String(o.files || '').split('\n').filter(Boolean);
  o.dateTH = thDate(o.date);
  o.hay = normT([o.label, o.book, o.subject, o.from, o.to, o.cat, o.owner, o.doer, o.purpose, o.venue, o.note, o.folder, o.old, o.status].join(' '));
  return o;
}
function toRec(a) { const o = {}; S.cols.forEach((c, i) => { o[c] = a[i]; }); return fixRec(o); }
function sortRecs() { S.recs.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (Number(b.reg) || 0) - (Number(a.reg) || 0)); }
function searchLocal(q, opt) {
  let qq = normT(q);
  const m = qq.match(/^([\u0E23\u0E2A])\s*0*(\d{1,4})\s*\/\s*(25\d\d)$/);
  if (m) qq = m[1] + ' ' + ('000' + m[2]).slice(-4) + '/' + m[3];
  const terms = qq ? (m ? [qq] : qq.split(' ').filter(Boolean)) : [];
  const out = S.recs.filter(r => (!opt.year || String(r.year) === String(opt.year)) && (!opt.dir || r.dir === opt.dir) &&
    (!opt.att || r.files.length) && (!opt.st || (r.status || '') === opt.st) && terms.every(x => r.hay.indexOf(x) >= 0));
  return { total: out.length, items: out.slice(0, opt.limit || 30), all: out };
}

    const s = await run('api_lineStatus', K);
    if (S.view !== 'line') return;
    S.line = { token: s.token && s.tokenOk, recipients: s.recipients.length, auto: s.auto, hour: s.hour };
    const q = s.quota; const pct = q && q.limit ? Math.min(100, Math.round(q.used / q.limit * 100)) : 0;
    const okTok = s.token && s.tokenOk;
    const copyRow = (id, val) => `<div class="copy"><input readonly value="${esc(val)}" id="${id}"><button class="btn sm" data-copy="${id}">${ic('copy')} คัดลอก</button></div>`;
    const rmBtn = (who, id) => `<button class="btn sm danger" data-rm="${who}" data-id="${esc(id)}">${ic('trash')}</button>`;
    $('#lnBody').innerHTML = `${flash ? `<div class="alert" style="background:var(--in-soft);color:var(--ok)">${ic('check')}<b>${esc(flash)}</b></div>` : ''}
    <div class="lgrid">
      <section class="panel">${stepHead(1, 'เชื่อม LINE OA กับระบบ', okTok)}<div class="pb lstack">
        <div><div class="lab">1.1 Webhook URL — วางใน LINE Developers → Messaging API → Webhook URL แล้วเปิด <b>Use webhook</b></div>${copyRow('wUrl', s.webhook)}</div>
        <div><div class="lab">1.2 Channel access token (long-lived) — กด Issue ใน LINE Developers แล้วคัดลอกมาวาง</div>
          ${okTok ? `<div class="okline">${ic('check')} เชื่อมแล้ว · Token ${esc(s.tokenTail)}</div>` : s.token ? `<div class="badline">${ic('x')} Token ใช้ไม่ได้ — วางตัวใหม่</div>` : ''}
          <div class="copy"><input id="tokIn" type="password" placeholder="วาง Channel access token ที่นี่" autocomplete="off"><button class="btn sm primary" id="tokSave">บันทึก</button></div></div>
        <div class="note">ทดสอบ: เพิ่มเพื่อน LINE OA แล้วพิมพ์ <code>id</code> — ถ้า OA ตอบรหัส U… กลับมา แปลว่าเชื่อมสำเร็จ</div>
      </div></section>
      <section class="panel">${stepHead(2, 'ผู้รับแจ้งเตือน', s.recipients.length > 0)}<div class="pb lstack">
        <div class="note">• <b>ส่งถึงตัวเอง (ประหยัดที่สุด):</b> ในแชต OA พิมพ์ <code>id</code> → คัดลอกรหัส U… มาวาง<br>• <b>ส่งเข้ากลุ่ม:</b> เชิญ OA เข้ากลุ่ม LINE → OA ทักพร้อมรหัสกลุ่ม C… (หรือกดเพิ่มจากรายการด้านล่าง)</div>
        <div class="copy"><input id="rcIn" placeholder="รหัส U… หรือ C… (33 ตัว)" autocomplete="off" spellcheck="false"><button class="btn sm primary" id="rcAdd">${ic('plus')} เพิ่ม</button></div>
        <div class="lrows">${s.recipients.map(r => `<div class="lrow"><span class="sic ${r.kind === 'user' ? 'ok' : ''}">${ic(r.kind === 'user' ? 'user' : 'users')}</span><div class="x"><b>${esc(r.name)}</b><small class="mono">${esc(r.id)}</small></div>${rmBtn('recipient', r.id)}</div>`).join('') || '<div class="note">— ยังไม่มีผู้รับ —</div>'}</div>
        ${(s.seen || []).filter(g => !s.recipients.some(r => r.id === g.id)).length ? `<div><div class="lab">กลุ่มที่ OA เพิ่งถูกเชิญเข้า</div><div class="lrows">${s.seen.filter(g => !s.recipients.some(r => r.id === g.id)).map(g => `<div class="lrow"><span class="sic">${ic('users')}</span><div class="x"><b>${esc(g.name)}</b><small>เข้ากลุ่มเมื่อ ${esc(g.at)}</small></div><button class="btn sm" data-addseen="${esc(g.id)}">${ic('plus')} เพิ่ม</button></div>`).join('')}</div></div>` : ''}
      </div></section>
      <section class="panel">${stepHead(3, 'แจ้งเตือนอัตโนมัติทุกเช้า', s.auto)}<div class="pb lstack">
        <label class="switch"><input type="checkbox" id="autoSw" ${s.auto ? 'checked' : ''}> ${s.auto ? 'เปิดอยู่ · ส่งราว ' + s.hour + ':00–' + s.hour + ':59 น. (วันไม่มีงาน ไม่ส่ง)' : 'ปิดอยู่ — กดเพื่อเปิด'}</label>
        <div><button class="btn sm" id="lnNow">${ic('send')} ส่งรอบวันนี้ทันที</button> <button class="btn sm" data-nav="events">${ic('cal')} ไปเพิ่มงาน</button></div>
        <div><div class="lab">โควตาข้อความเดือนนี้</div>${q ? `<b style="font-size:22px">${q.used.toLocaleString()}</b> <span class="note">${q.limit ? '/ ' + q.limit.toLocaleString() + ' ข้อความ' : 'ข้อความ (ไม่จำกัด)'}</span>${q.limit ? `<div class="meter"><i style="width:${pct}%;${pct > 80 ? 'background:var(--crit)' : ''}"></i></div>` : ''}` : '<span class="note">อ่านได้หลังเชื่อม LINE OA</span>'}
          <div class="note">ส่งถึงตัวเอง 1 ครั้ง = 1 ข้อความ · เข้ากลุ่ม = จำนวนสมาชิก · คำสั่ง งานวันนี้/งานพรุ่งนี้ ไม่นับโควตา</div></div>
      </div></section>
      <section class="panel"><h2>${ic('search')} ค้นหาหนังสือผ่าน LINE</h2><div class="pb lstack">
        <div class="note">คนที่อยู่ในรายการนี้พิมพ์คำค้นในแชต OA แล้วได้ผลพร้อมปุ่มเปิดหนังสือ (อ่านอย่างเดียว) — ให้เขาพิมพ์ <code>id</code> แล้วส่งรหัสมาให้คุณ</div>
        <div class="copy"><input id="usIn" placeholder="รหัส U… (33 ตัว)" autocomplete="off" spellcheck="false"><button class="btn sm primary" id="usAdd">${ic('plus')} เพิ่ม</button></div>
        <div class="lrows">${(s.users || []).map(u => `<div class="lrow"><span class="sic">${ic('user')}</span><div class="x"><small class="mono">${esc(u)}</small></div>${rmBtn('user', u)}</div>`).join('') || '<div class="note">— ยังไม่มี —</div>'}</div>
      </div></section>
      <section class="panel"><h2>${ic('users')} แชร์ให้คนอื่นดู (แก้ไขไม่ได้)</h2><div class="pb lstack">
        <div><div class="lab">ลิงก์ผู้ดู — ส่งให้อาจารย์/เจ้าหน้าที่</div>${copyRow('vUrl', s.viewUrl)}</div>
        <div class="note">เปลี่ยนรหัสผู้ดู/ผู้ดูแลเอง: Apps Script → ⚙ การตั้งค่าโปรเจ็กต์ → คุณสมบัติของสคริปต์ → PAGE_KEY / VIEW_KEY</div>
      </div></section>
    </div>`;
    const body = $('#lnBody');
    body.onclick = async e => {
      const c = e.target.closest('[data-copy]');
      if (c) { const inp = $('#' + c.dataset.copy); try { await navigator.clipboard.writeText(inp.value); toast('คัดลอกแล้ว'); } catch (er) { inp.select(); toast('กด Ctrl+C เพื่อคัดลอก'); } return; }
      const rm = e.target.closest('[data-rm]');
      if (rm) { if (!confirm('ลบ ' + rm.dataset.id + ' ?')) return; return lineOp(() => run('api_lineList', K, rm.dataset.rm, 'remove', rm.dataset.id)); }
      const as = e.target.closest('[data-addseen]');
      if (as) return lineOp(() => run('api_lineList', K, 'recipient', 'add', as.dataset.addseen), as);
    };
    $('#tokSave').onclick = () => lineOp(() => run('api_lineToken', K, $('#tokIn').value), $('#tokSave'));
    $('#rcAdd').onclick = () => lineOp(() => run('api_lineList', K, 'recipient', 'add', $('#rcIn').value), $('#rcAdd'));
    $('#usAdd').onclick = () => lineOp(() => run('api_lineList', K, 'user', 'add', $('#usIn').value), $('#usAdd'));
    $('#lnNow').onclick = sendNow;
    $('#autoSw').onchange = async e => {
      const on = e.target.checked; e.target.disabled = true;
      try { const r = await run('api_setAuto', K, on); loadLine(r ? 'เปิดแจ้งเตือนอัตโนมัติแล้ว' : 'ปิดแจ้งเตือนอัตโนมัติแล้ว'); }
      catch (er) { toast(errMsg(er)); e.target.checked = !on; e.target.disabled = false; }
    };
  } catch (e) { $('#lnBody').innerHTML = `<div class="warnbox">${esc(errMsg(e))}</div>`; }
}
async function lineOp(fn, btn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  try { const r = await fn(); loadLine(r && r.msg); }
  catch (e) { toast(errMsg(e)); if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.t; } }
}

/* ======================= start ======================= */
function showGate(msg) {
  document.querySelector('.app').hidden = true; $('#bNav').hidden = true; $('#gate').hidden = false;
  $('#gErr').textContent = msg || ''; setTimeout(() => $('#gCode').focus(), 50);
}
function applyBoot(b) {
  ADMIN = b.role === 'admin';
  if (b.meta) S.meta = b.meta;
  if (b.events) S.upEvents = b.events;
  S.line = b.line || null;
  if (b.recs) { S.cols = b.cols; S.recs = b.recs.map(toRec); sortRecs(); S.ver = b.ver || ''; }
}
function refreshView() {
  if ($('#drawerHost').innerHTML) return;          // กำลังเปิดอ่านอยู่ — ไม่รบกวน
  if (S.view === 'home') loadHome();
  else if (S.view === 'letters') doSearch();
}
async function enter(key, remember, force) {
  K = key;
  $('#gate').hidden = true; document.querySelector('.app').hidden = false; $('#bNav').hidden = false;
  PERSIST = remember === true || (remember === undefined && store.get() === key);
  let c = PERSIST && !force ? await IDB.get('cache') : null;
  if (c && (c.k !== key || !c.recs || !c.cols)) c = null;
  if (c) {                                          // มีข้อมูลในเครื่อง → แสดงทันที แล้วค่อยตรวจของใหม่
    applyBoot(c); renderNav(); go(S.q ? 'letters' : (NAV.some(n => n.id === S.view) && S.view !== 'home' ? S.view : 'home'));
    sync('กำลังตรวจข้อมูลล่าสุด…');
  } else {
    const t0 = Date.now();
    $('#view').innerHTML = `<div class="loading"><div class="ring"></div><b>กำลังเปิดทะเบียนสารบรรณ…</b><span class="note" id="ldTxt">โหลดครั้งแรกครั้งเดียว ครั้งต่อไปจะเปิดได้ทันที</span></div>`;
    enter.tick = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); const el = $('#ldTxt'); if (el && s > 3) el.textContent = 'กำลังโหลด… ' + s + ' วินาที (ครั้งแรกอาจใช้ 10–20 วินาที)'; }, 1000);
  }
  try {
    const b = await run('api_boot', K, c ? c.ver : '');
    clearInterval(enter.tick);
    if (remember !== undefined) store.set(key, remember);
    const wasAdmin = ADMIN;
    if (b.same) { b.recs = null; applyBoot(b); S.ver = b.ver; } else applyBoot(b);
    if (!c) { renderNav(); go(S.q ? 'letters' : 'home'); }
    else { if (wasAdmin !== ADMIN) { renderNav(); go('home'); } else refreshView(); sync(b.same ? 'ข้อมูลล่าสุดแล้ว' : 'อัปเดตข้อมูลใหม่แล้ว', 'ok'); }
    saveCache();
  } catch (e) {
    clearInterval(enter.tick);
    const msg = errMsg(e);
    if (/ลิงก์ไม่ถูกต้อง|รหัสถูกเปลี่ยน/.test(msg)) { store.clear(); IDB.del('cache'); K = ''; sync(); showGate('รหัสไม่ถูกต้อง หรือถูกเปลี่ยนแล้ว'); }
    else if (c) sync('ออฟไลน์ — แสดงข้อมูลที่บันทึกไว้ในเครื่อง', 'off');
    else { $('#view').innerHTML = `<div class="warnbox"><b>เชื่อมต่อไม่ได้</b><br>${esc(msg)}<br><button class="btn sm" id="retry" style="margin-top:10px">ลองใหม่</button> <button class="btn sm" data-logout>ใส่รหัสใหม่</button></div>`; $('#retry').onclick = () => enter(key, remember); }
  }
}
function logout() {
  if (K && !confirm('ออกจากระบบในเครื่องนี้? ครั้งหน้าต้องใส่รหัสใหม่')) return;
  store.clear(); IDB.del('cache'); K = ''; ADMIN = false; S.recs = null; S.ver = ''; closeDrawer(); $('#gCode').value = ''; showGate();
}
$('#gForm').onsubmit = e => {
  e.preventDefault();
  const k = keyFrom($('#gCode').value);
  if (!k) { $('#gErr').textContent = 'รหัสต้องเป็นตัวอักษรอังกฤษหรือตัวเลข 6–40 ตัว (หรือวางลิงก์ที่มี k=)'; return; }
  enter(k, $('#gRemember').checked);
};
(function start() {
  if (!APP_URL) { showGate('ยังไม่ได้ตั้งค่า SARABAN_APP_URL ในไฟล์ index.html'); return; }
  const h = location.hash.replace(/^#/, '');
  const hk = (h.match(/(?:^|&)k=([A-Za-z0-9]{6,40})/) || [])[1];
  const hq = (h.match(/(?:^|&)q=([^&]*)/) || [])[1];
  if (hq) { try { S.q = decodeURIComponent(hq); } catch (e) { } }
  if (h) history.replaceState(null, '', location.pathname + location.search);
  if (hk) enter(hk, true);
  else { const s = store.get(); if (s) enter(s); else showGate(); }
})();
})();
</script>
</body>
</html>
